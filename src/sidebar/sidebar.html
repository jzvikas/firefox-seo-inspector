<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Firefox SEO Inspector</title>
  <link rel="stylesheet" href="sidebar.css">
</head>
<body>
  <header class="topbar">
    <div>
      <strong>SEO Inspector</strong>
      <div id="pageUrl" class="muted url" title=""></div>
    </div>
    <button id="refreshButton" class="icon-button" type="button" title="Refresh audit" aria-label="Refresh audit">↻</button>
  </header>

  <section id="statusPanel" class="status-panel">
    <div id="score" class="score">–</div>
    <div class="status-copy">
      <div id="statusTitle">Waiting for page…</div>
      <div id="statusCounts" class="muted"></div>
    </div>
  </section>

  <nav class="tabs" aria-label="Inspector sections">
    <button class="tab active" data-tab="overview" type="button">Overview</button>
    <button class="tab" data-tab="indexability" type="button">Indexability</button>
    <button class="tab" data-tab="serp" type="button">SERP</button>
    <button class="tab" data-tab="hreflang" type="button">Hreflang</button>
    <button class="tab" data-tab="issues" type="button">Issues</button>
    <button class="tab" data-tab="headings" type="button">Headings</button>
    <button class="tab" data-tab="links" type="button">Links</button>
    <button class="tab" data-tab="images" type="button">Images</button>
    <button class="tab" data-tab="schema" type="button">Schema</button>
    <button class="tab" data-tab="social" type="button">Social</button>
    <button class="tab" data-tab="compare" type="button">Compare</button>
  </nav>

  <main>
    <section id="overview" class="panel active"></section>
    <section id="indexability" class="panel"></section>
    <section id="serp" class="panel"></section>
    <section id="hreflang" class="panel"></section>
    <section id="issues" class="panel"></section>
    <section id="headings" class="panel"></section>
    <section id="links" class="panel"></section>
    <section id="images" class="panel"></section>
    <section id="schema" class="panel"></section>
    <section id="social" class="panel"></section>
    <section id="compare" class="panel"></section>
  </main>

  <footer class="footer">
    <button id="copyIssuesButton" type="button">Copy issues</button>
    <button id="exportButton" type="button">Export JSON</button>
  </footer>

  <script src="../lib/seo-core.js"></script>
  <script src="../lib/indexability.js"></script>
  <script src="../lib/serp-preview.js"></script>
  <script src="../lib/hreflang.js"></script>
  <script src="sidebar-base.js"></script>
  <script src="sidebar-render.js"></script>
  <script src="sidebar-indexability.js"></script>
  <script src="sidebar-serp.js"></script>
  <script src="sidebar-hreflang.js"></script>
  <script src="sidebar-main.js"></script>
</body>
</html>
