name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Static, manifest, and privacy checks
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Mozilla web-ext lint
        run: npx --yes web-ext@10.6.0 lint --source-dir src

      - name: Build deterministic XPI
        run: npm run build

      - name: Verify XPI contents and checksum
        run: npm run verify:build

      - name: Verify build reproducibility
        shell: bash
        run: |
          cp dist/seo-inspector-*.xpi /tmp/first-build.xpi
          cp dist/seo-inspector-*.xpi.sha256 /tmp/first-build.xpi.sha256
          npm run build
          cmp /tmp/first-build.xpi dist/seo-inspector-*.xpi
          cmp /tmp/first-build.xpi.sha256 dist/seo-inspector-*.xpi.sha256

      - name: Upload verified XPI
        uses: actions/upload-artifact@v4
        with:
          name: firefox-seo-inspector-xpi
          path: |
            dist/seo-inspector-*.xpi
            dist/seo-inspector-*.xpi.sha256
          if-no-files-found: error
          retention-days: 14
